services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ziber_db
    ports:
      - "3306:3306"
    volumes:
      - ./db.sql:/docker-entrypoint-initdb.d/init.sql:ro

  smtp4dev:
    image: rnwood/smtp4dev:v3
    restart: always
    ports:
      - "8080:80"
      - "2525:25"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - smtp4dev
