name: Security and tests

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml
          coverage: none
      - name: Install development dependencies
        working-directory: web-aplikazioa
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        working-directory: web-aplikazioa
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        working-directory: web-aplikazioa
        run: composer test
      - name: Security regression checks
        working-directory: web-aplikazioa
        run: |
          ! grep -RInE "md5\s*\(|SELECT .*\\$(_GET|_POST)|mysqli_query\(.*\\." --include='*.php' .
          test -f src/Core/security.php
          grep -q "password_verify" src/Modules/Auth/login.php
          grep -q "csrf_token" src/Modules/Account/account.php

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/php
