services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: BDweb
    ports:
      - "3306:3306"
    volumes:
      - ./scripts/db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: php:8.2-apache
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "docker-php-ext-install mysqli &&
      apache2-foreground"